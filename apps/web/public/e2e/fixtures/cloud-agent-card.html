<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud agent card fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e0e10;
        color: #ececee;
        display: grid;
        place-items: center;
      }
      a.card {
        display: block;
        width: min(340px, 90vw);
        border-radius: 18px;
        border: 1px solid #232326;
        background: #17171a;
        padding: 18px;
        text-decoration: none;
        color: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .title {
        font-size: 15px;
        font-weight: 500;
      }
      .status {
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 13px;
        background: rgba(245, 160, 60, 0.14);
        color: #f5a03c;
        animation: rkPulse 1.2s ease-in-out infinite;
      }
      .pr {
        margin-top: 8px;
        font-size: 14.5px;
        color: #a8a8ad;
      }
      @keyframes rkPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <a
      class="card"
      data-testid="cloud-agent-card"
      href="https://github.com/example/demo/pull/1"
      target="_blank"
      rel="noreferrer"
    >
      <div class="row">
        <span class="title">Add a README with setup instructions</span>
        <span class="status">running</span>
      </div>
      <div class="pr">Pull request</div>
    </a>
  </body>
</html>
